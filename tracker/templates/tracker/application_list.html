{% extends 'tracker/base.html' %}
{% block content %}
 <h1>Job Applications</h1>
 <a href="{% url 'application_create' %}">+ Add New Application</a>
 
 <ul>
  {% for application in applications %}
    <li>{{ application }} 
    <a href="{% url 'application_edit' application.pk %}">Edit</a>
    <a href="{% url 'application_delete' application.pk %}">Delete</a>
    </li>
  {% endfor %}
 </ul>
{% endblock %}
